<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillPass TL — Training, Licensing &amp; Site Connectivity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect x="1" y="1" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 22 L13 10 L19 22 Z" fill="currentColor"/><rect x="20" y="15" width="5" height="7" fill="currentColor"/></svg>
      </div>
      <div>
        <div class="brand-name">SkillPass TL</div>
        <div class="brand-sub">Training · Licensing · Sites</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#overview" data-r="overview">Overview</a>
      <a href="#register" data-r="register">Register trainee</a>
      <a href="#checkin" data-r="checkin">Check-in &amp; verify</a>
      <a href="#licences" data-r="licences">Licence register</a>
      <a href="#classes" data-r="classes">Classes</a>
      <a href="#sites" data-r="sites">Sites &amp; links</a>
    </nav>
    <div class="side-foot">
      <div class="sync" id="sync"><span class="dot"></span><span id="syncText">Online</span></div>
      <div class="operator">Operator: <b>Dili HQ desk 2</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="crumbs" id="crumbs">Overview</div>
      <div class="top-right">
        <span class="mono small" id="clock"></span>
        <select id="siteSel" aria-label="Current site"></select>
      </div>
    </header>
    <section id="view" class="view"></section>
    <footer class="foot">
      Concept prototype by Avora Consulting Services. All names and records are demo data. Not an official licensing system.
    </footer>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" id="modalClose" aria-label="Close">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="vendor/face-api.js"></script>
<script src="app.js"></script>
</body>
</html>
